# mac-time-keeper configuration
# Use a server that is reachable and geographically close to the Mac.
TIME_SERVER=time.apple.com

# Per-request timeout and number of DNS records queried by macOS sntp.
TIMEOUT_SECONDS=3
DNS_RECORDS=3

# Log a warning when the measured absolute offset reaches this value.
WARN_OFFSET_MS=20

# Trading-safe default: 0 only slews offsets below 50 ms and never steps time.
# Set to 1 only if keeping wall-clock time aligned is more important than
# avoiding a forward/backward jump after boot or a long network outage.
ALLOW_TIME_STEP=0
